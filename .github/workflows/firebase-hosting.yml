name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde oct-2026
    steps:
      - uses: actions/checkout@v4
      - name: Armar la página de Logística
        run: python3 tools/paginas.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: fb
        continue-on-error: true
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: qualita-produccion
      # Respaldo: si la herramienta de Firebase falla (p. ej. sin permiso para revisar APIs habilitadas),
      # se publica directo con la API de Hosting, que solo necesita permisos de Hosting.
      - name: Publicar directo (respaldo)
        if: steps.fb.outcome == 'failure'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node tools/deploy_hosting.mjs 2>&1 | tee "$RUNNER_TEMP/dep.txt" || { tail -n 5 "$RUNNER_TEMP/dep.txt" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          tail -n 1 "$RUNNER_TEMP/dep.txt" | while IFS= read -r l; do echo "::notice::$l"; done
