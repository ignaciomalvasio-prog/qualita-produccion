name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde oct-2026
    steps:
      - uses: actions/checkout@v4
      - name: Armar la página de Logística
        run: python3 tools/paginas.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: qualita-produccion
      # Si la publicación falla, se repite con la herramienta de Firebase y las últimas líneas quedan como avisos legibles.
      - name: Diagnóstico si falló
        if: failure()
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@latest deploy --only hosting --project qualita-produccion --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1 || true
          tail -n 25 "$RUNNER_TEMP/out.txt" | sed 's/[%]/%25/g' | while IFS= read -r l; do [ -n "$l" ] && echo "::warning::$l"; done
          rm -f "$RUNNER_TEMP/sa.json"
