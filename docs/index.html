<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d5b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Producción">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Producción Qualitá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Dos pantallas de lectura, iguales a lo que hoy circula por WhatsApp: la orden de producción (como el Word) y la planilla de medias (como el Excel). */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunken:#e3e9ee; --ink:#14222c; --muted:#566874; --line:#cdd7de;
  --accent:#0d5b78; --accent-ink:#ffffff; --accent-soft:#dcecf2;
  --ok:#1c7446; --ok-soft:#dff1e6; --warn:#8a5600; --warn-soft:#fbeed0; --crit:#b0261d; --crit-soft:#fbe2df;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e161b; --surface:#17222a; --sunken:#111b21; --ink:#e5edf2; --muted:#93a6b3; --line:#2b3a45;
  --accent:#6fc3df; --accent-ink:#082029; --accent-soft:#143440;
  --ok:#62cc96; --ok-soft:#143021; --warn:#e8b65c; --warn-soft:#3a2c10; --crit:#f4918a; --crit-soft:#401b19;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e161b; --surface:#17222a; --sunken:#111b21; --ink:#e5edf2; --muted:#93a6b3; --line:#2b3a45;
  --accent:#6fc3df; --accent-ink:#082029; --accent-soft:#143440;
  --ok:#62cc96; --ok-soft:#143021; --warn:#e8b65c; --warn-soft:#3a2c10; --crit:#f4918a; --crit-soft:#401b19;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
h2{font-size:22px;font-weight:700;line-height:1.1;text-transform:uppercase}
h3{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .neg{color:var(--crit)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 16px;cursor:pointer;min-height:42px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.state{padding:24px 8px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.crit{background:var(--crit-soft);color:var(--crit)} .badge.plain{background:var(--sunken);color:var(--muted)}

.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .tit{font:700 22px var(--display);text-transform:uppercase;min-width:0;flex:1 1 auto}
.btn{font:600 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:14px}
.btn.x{padding:0;width:32px;min-height:32px;color:var(--muted)}
.btn.lnk{border-color:transparent;background:transparent;color:var(--accent);padding-inline:4px}
.btn.step{width:44px;padding:0;font-size:22px}
.btn:disabled{opacity:.45;cursor:default}
.btn.rojo{color:var(--crit);border-color:var(--crit)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.guardado{font-size:13px;color:var(--muted)} .guardado.err{color:var(--crit)}

input,select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.35}
input.n{width:76px;text-align:right;font-variant-numeric:tabular-nums}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo > span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* orden de producción, como el Word */
.op{font-weight:700;text-transform:uppercase;font-size:17px;line-height:1.35;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.op .op-f{text-decoration:underline;font-size:20px}
.op .op-m{font-size:20px}
.op .op-c{display:flex;flex-direction:column;gap:6px;padding:2px 0}
.op .op-c u{text-underline-offset:3px}
.op .op-c.colg{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 10px;border-radius:0 4px 4px 0}
.ed-corte{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-corte.colg{border-color:var(--warn);background:var(--warn-soft)}
.ed-corte .cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ed-corte .cab input{flex:1 1 160px;font-weight:700;text-transform:uppercase}
.ed-linea{display:flex;gap:6px;align-items:flex-start}
.ed-linea textarea{text-transform:uppercase}
.txt{min-height:240px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--sunken)}

/* planilla de medias, como el Excel */
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dias{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dia.hoy{border-color:var(--accent);border-width:2px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.pl th,.pl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
.pl th:first-child,.pl td:first-child{text-align:left;overflow-wrap:anywhere}
.pl thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--ink)}
.pl tbody td:first-child{font-weight:600;text-transform:uppercase}
.pl tfoot th,.pl tfoot td{font-weight:700;background:var(--sunken);border-bottom:0;text-transform:uppercase;font-size:14px}
.pl td input{width:100%}
.pl td input.n{width:64px}
.pl td.xq{width:34px;padding-inline:0}
.desp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 10px;font-weight:700;text-transform:uppercase}
.desp b{font:700 24px var(--display)}
.stk{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px}
.stk dt{color:var(--muted)} .stk dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:1100px){
  .dias{grid-template-columns:minmax(0,1fr)}
  .dias[data-sel="0"] .dia:not(:nth-child(1)),.dias[data-sel="1"] .dia:not(:nth-child(2)),.dias[data-sel="2"] .dia:not(:nth-child(3)),.dias[data-sel="3"] .dia:not(:nth-child(4)),.dias[data-sel="4"] .dia:not(:nth-child(5)){display:none}
}
@media (min-width:1101px){ .dtabs{display:none} }

.cl-dia{max-width:560px}
.cl-dia th,.cl-dia td{font-size:18px;padding:9px 8px}
.cl-dia thead th{font-size:12px}
.cl-dia tfoot th,.cl-dia tfoot td{font-size:18px}
/* inicio */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:18px 16px;cursor:pointer;color:var(--ink);font:500 16px var(--body);min-height:120px}
.tile b{font:700 28px var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1}
.tile .dato{font-weight:600}
h1 a{color:inherit;text-decoration:none}
/* pedidos */
.card{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card.duda{border-color:var(--warn)}
.cl{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto auto;gap:6px;align-items:start}
.cl label{display:flex;gap:4px;align-items:center;font-size:13px;white-space:nowrap;min-height:36px}
@media (max-width:560px){ .cl{grid-template-columns:minmax(0,1fr) auto auto} .cl textarea{grid-column:1 / -1;grid-row:2} }
.lista{display:flex;flex-direction:column}
.item{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .cuerpo{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
details > summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] > summary{margin-bottom:10px}
.pie{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}

/* impresión: solo la vista abierta, en blanco y negro, sin botones */
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--sunken:#fff;--ink:#000;--muted:#333;--line:#888;--accent:#000;--accent-ink:#000;--accent-soft:#fff;--warn:#000;--warn-soft:#fff;--crit:#000;--crit-soft:#fff;--ok:#000;--ok-soft:#fff;color-scheme:light}
  body{font-size:12px}
  .wrap{max-width:none;padding:0;gap:8px}
  .tabs,.pie,.btn,.dtabs,.acciones,input,select,textarea,.guardado,#copiado{display:none!important}
  .top{border-bottom:2px solid #000;padding-bottom:4px}
  h1{font-size:14px}
  .nav .tit{font-size:20px}
  #view-produccion .nav{display:none}
  .panel{border:0;padding:0}
  .op{font-size:14px;line-height:1.3;gap:7px}
  .op .op-f,.op .op-m{font-size:17px}
  .op .op-c{gap:3px;break-inside:avoid}
  .op .op-c.colg{border-left:3px solid #000;padding:2px 0 2px 8px}
  .dias{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px}
  .dias .dia{display:flex!important;border:1px solid #000;border-radius:0;padding:6px;gap:6px;break-inside:avoid}
  .dia.hoy{border-width:1px}
  .dia h2{font-size:15px}
  .pl th,.pl td{padding:2px 3px;font-size:11px}
  .pl thead th{font-size:8px;border-bottom:1px solid #000}
  .pl tfoot th,.pl tfoot td{font-size:11px;border-top:1px solid #000}
  .cl-dia{max-width:none}
  .cl-dia th,.cl-dia td{font-size:15px;padding:5px 4px}
  .cl-dia tfoot th,.cl-dia tfoot td{font-size:15px}
  #view-medias h2{font-size:15px}
  .desp{background:none;color:#000;border:1.5px solid #000;border-radius:0;padding:4px 6px;font-size:10px}
  .desp b{font-size:15px}
  .stk{font-size:10px;gap:1px 6px}
  .badge{border:1px solid #000;padding:0 4px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="#inicio" data-tab="inicio" id="logo">Producción Qualitá</a></h1>
    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button class="tab" role="tab" id="tab-inicio" data-tab="inicio" aria-selected="true">Inicio</button>
      <button class="tab" role="tab" id="tab-produccion" data-tab="produccion" aria-selected="false">Producción</button>
      <button class="tab" role="tab" id="tab-medias" data-tab="medias" aria-selected="false">Medias</button>
      <button class="tab" role="tab" id="tab-pedidos" data-tab="pedidos" aria-selected="false" hidden>Pedidos</button>
    </nav>
  </header>
  <main>
    <section class="view" id="view-inicio"></section>
    <section class="view" id="view-produccion" hidden></section>
    <section class="view" id="view-medias" hidden></section>
    <section class="view" id="view-pedidos" hidden></section>
  </main>
  <footer class="pie small muted"><span id="stamp"></span><span id="sesion" class="acciones"></span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
