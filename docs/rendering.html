<!doctype html>
<html lang="es" data-solo="rendering">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4fa3c5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rendering">
<meta property="og:title" content="Rendering Qualitá">
<meta property="og:description" content="Kilos de insumos y producidos de rendering, por día, del Frigorífico Qualitá.">
<meta property="og:image" content="https://qualita-produccion.web.app/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="rendering.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rendering Qualitá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Colores suaves (opción "celeste claro", elegida por Renzo el 20/10): celeste #4fa3c5 y fondos celestes claros; el petróleo del logo #005e78 queda solo en el logo. El rojo queda reservado para avisos. */
:root{
  --bg:#f7fafb; --surface:#ffffff; --sunken:#f0f5f7; --ink:#33444d; --muted:#74858e; --line:#e1e8ec;
  --accent:#4fa3c5; --accent-ink:#ffffff; --accent-soft:#eef7fb; --celeste:#7ac3f0; --fuerte:#2c7a97; --suave:#e3f2f9;
  --ok:#1c7446; --ok-soft:#dff1e6; --warn:#8a5600; --warn-soft:#fbeed0; --crit:#a5251c; --crit-soft:#f9e1de;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e161b; --surface:#17222a; --sunken:#111b21; --ink:#e5edf2; --muted:#93a6b3; --line:#2b3a45;
  --accent:#6fc3df; --accent-ink:#082029; --accent-soft:#143440;
  --ok:#62cc96; --ok-soft:#143021; --warn:#e8b65c; --warn-soft:#3a2c10; --crit:#f4918a; --crit-soft:#401b19;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e161b; --surface:#17222a; --sunken:#111b21; --ink:#e5edf2; --muted:#93a6b3; --line:#2b3a45;
  --accent:#6fc3df; --accent-ink:#082029; --accent-soft:#143440;
  --ok:#62cc96; --ok-soft:#143021; --warn:#e8b65c; --warn-soft:#3a2c10; --crit:#f4918a; --crit-soft:#401b19;
  color-scheme:dark }

/* Bloques grandes en celeste claro con letra azul, en vez de bloque oscuro (solo en modo claro). */
@media not all and (prefers-color-scheme: dark){
  .cam>.cam-cab,.dash-hero{background:var(--suave)!important;color:var(--fuerte)!important}
  .cam>.cam-cab .btn{background:#fff}
  .dash-hero .kpi{background:#fff;border-color:var(--line)} .dash-hero::after{display:none}
  .kg-ped,.badge.cam-ped,.h-cli:not(.vacio),.badge.cong{background:var(--suave)!important;color:var(--fuerte)!important}
  .kg-ped small{color:var(--fuerte)!important}
  .btn[aria-pressed="true"]{background:var(--fuerte)!important;border-color:var(--fuerte)!important;color:#fff!important}
}
@media print{ .cam>.cam-cab,.dash-hero{background:none!important;color:#000!important} .kg-ped,.badge.cam-ped,.h-cli,.badge.cong{background:none!important;color:#000!important} }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
h2{font-size:22px;font-weight:700;line-height:1.1;text-transform:uppercase}
h3{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .neg{color:var(--crit)}
.num{font-variant-numeric:tabular-nums}

/* Encabezado: franja blanca de lado a lado con el logo colgando apenas del borde, como la cinta de la escarapela. */
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:8px 0 12px;position:relative;z-index:20;isolation:isolate}
.top::before{content:"";position:absolute;inset:0 -100vmax;background:var(--surface);border-bottom:4px solid var(--accent);z-index:-1}
html,body{overflow-x:clip}
.marca a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.marca img{height:78px;width:auto;margin-bottom:-26px;position:relative;z-index:1;flex:0 0 auto}
.marca-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.marca-nom{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.marca-dia{font:500 14px/1.1 var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs[hidden]{display:none!important}
.tab{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:9px 16px;cursor:pointer;min-height:42px}
.tab:hover{background:var(--sunken)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:761px){ .top{position:sticky;top:0} .dia-ped,.cam{scroll-margin-top:96px} }
@media (max-width:760px){
  .top{gap:6px;padding:6px 0 10px}
  .marca img{height:50px;margin-bottom:0}
  .marca-nom{font-size:19px}
  .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;gap:3px}
  .tabs.muchas{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr))}
  .tab{padding:8px 2px;min-height:40px;font-size:clamp(12.5px,3.7vw,16px);letter-spacing:.01em;background:var(--sunken)}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.state{padding:24px 8px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.crit{background:var(--crit-soft);color:var(--crit)} .badge.plain{background:var(--sunken);color:var(--muted)}
.badge.cong{background:var(--accent);color:var(--accent-ink)} .badge.fresco{background:var(--ok-soft);color:var(--ok)}
.badge.vend{background:var(--warn-soft);color:var(--warn)}
.ventas{border-left:4px solid var(--warn)} .ventas h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.venta{border-top:1px solid var(--line);padding:10px 0} .venta-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline} .venta-cab .nom{font-weight:700}
.venta-det{margin:6px 0;padding-left:18px} .venta-det li{margin:2px 0} .v-motivo{flex:1;min-width:150px}
.aviso-vend{display:flex;gap:6px;align-items:center;width:100%;margin:0 0 12px;padding:12px 14px;border:1px solid var(--warn);border-radius:10px;background:var(--warn-soft);color:var(--warn);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.aviso-vend span{margin-left:auto}
.filtro-vend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.v-fotos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.v-foto{padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:zoom-in;line-height:0}
.v-foto img{width:120px;height:120px;object-fit:cover;border-radius:4px}
.v-fotos.grande .v-foto{cursor:zoom-out;flex-basis:100%}
.v-fotos.grande .v-foto img{width:100%;max-width:900px;height:auto;object-fit:contain}
.v-msg{white-space:pre-wrap;background:var(--sunken);padding:8px;border-radius:4px;margin:6px 0;max-height:220px;overflow:auto}

.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .tit{font:700 26px/1.05 var(--display);text-transform:uppercase;min-width:0;flex:1 1 auto;order:-1}
.nav.armada{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 14px;align-items:center}
.nav-dia{display:inline-flex;gap:6px;align-items:center;justify-self:center}
.nav-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;justify-self:end;min-width:0}
.nav-acc:empty{display:none}
@media (max-width:900px){ .nav.armada{grid-template-columns:minmax(0,1fr)} .nav-dia,.nav-acc{justify-self:start;justify-content:flex-start} }
@media print{ .nav.armada{display:flex} .nav-dia,.nav-acc{display:none} }
.nav .tit .tag{font:600 13px var(--body);text-transform:none;color:var(--muted);margin-left:6px}
.dia-ped>.nav-ped{padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:10px}
.otros-dias{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}.otros-dias .btn b{color:var(--accent);margin-left:2px}
.btn{font:600 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.carga .btn.pri{min-width:170px;justify-content:center;text-align:center}
.btn.pri:disabled{opacity:.5}
.btn.pri.activo{box-shadow:inset 0 0 0 2px var(--accent-ink),0 0 0 2px var(--accent)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:14px}
.btn.x{padding:0;width:32px;min-height:32px;color:var(--muted)}
.btn.lnk{border-color:transparent;background:transparent;color:var(--accent);padding-inline:4px}
.btn.step{width:44px;padding:0;font-size:22px}
.btn:disabled{opacity:.45;cursor:default}
.btn.rojo{color:var(--crit);border-color:var(--crit)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.guardado{font-size:13px;color:var(--muted)} .guardado.err{color:var(--crit)}

input,select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.35}
.pegar{margin-top:12px}.pegar .acciones{margin-top:8px}
input.n{width:76px;text-align:right;font-variant-numeric:tabular-nums}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo > span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* orden de producción, como el Word */
.op{font-weight:700;text-transform:uppercase;font-size:17px;line-height:1.35;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.op .op-f{text-decoration:underline;font-size:20px}
.op .op-m{font-size:20px}
.op .op-c{display:flex;flex-direction:column;gap:6px;padding:2px 0}
.op .op-c u{text-underline-offset:3px}
.op .op-c.colg{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 10px;border-radius:0 4px 4px 0}
.op-doc{font:inherit;font-weight:700;text-transform:uppercase;line-height:1.5;width:100%;min-height:320px;resize:none;overflow:hidden;border:1px dashed var(--line);border-radius:4px;padding:12px;background:var(--surface);color:var(--ink)}
.op-doc:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.colgados{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.colgados .chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-transform:uppercase}
.ed-corte{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-corte.colg{border-color:var(--warn);background:var(--warn-soft)}
.ed-corte .cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ed-corte .cab input{flex:1 1 160px;font-weight:700;text-transform:uppercase}
.ed-linea{display:flex;gap:6px;align-items:flex-start}
.ed-linea textarea{text-transform:uppercase}
.txt{min-height:240px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--sunken)}

/* planilla de medias, como el Excel */
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:12px;right:12px;bottom:16px;margin-inline:auto;width:fit-content;z-index:50;max-width:min(680px,calc(100vw - 24px));background:var(--ink);color:var(--bg);font:500 14px/1.4 var(--body);padding:10px 16px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--crit);color:#fff}
.toast[hidden]{display:none}
.nueva{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:8px 12px;background:var(--warn-soft);color:var(--warn);font-weight:700;border-bottom:2px solid var(--warn)}
.semtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.semtabs .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;min-width:0}
.semtabs .btn b{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.02em}
.semtabs .btn span{font-size:12px;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.semtabs .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dias{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dia.hoy{border-color:var(--accent);border-width:2px}
.dia .pl th,.dia .pl td{padding-left:4px;padding-right:4px}
.dia .pl thead th{letter-spacing:.02em;font-size:10px}
.dia .pl th:not(:first-child),.dia .pl td:not(:first-child){white-space:nowrap;width:1%}
.pf textarea{width:100%;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.pf .pf-dias{margin-top:12px}
.aviso-pf{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
@media (max-width:1100px){ .pf .pf-dias{grid-template-columns:minmax(0,1fr)} .pf .pf-dias .dia{display:flex!important} }
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.pl th,.pl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
.pl th:first-child,.pl td:first-child{text-align:left;overflow-wrap:break-word}
.pl thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--ink)}
.pl tbody td:first-child{font-weight:600;text-transform:uppercase}
.pl tfoot th,.pl tfoot td{font-weight:700;background:var(--sunken);border-bottom:0;text-transform:uppercase;font-size:14px}
.pl td input{width:100%}
.pl td input.n{width:64px}
.pl td.xq{width:34px;padding-inline:0}
.desp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 10px;font-weight:700;text-transform:uppercase}
.desp b{font:700 24px var(--display)}
.stk{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px}
.stk dt{color:var(--muted)} .stk dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:1100px){
  .dias{grid-template-columns:minmax(0,1fr)}
  .dias[data-sel="0"] .dia:not(:nth-child(1)),.dias[data-sel="1"] .dia:not(:nth-child(2)),.dias[data-sel="2"] .dia:not(:nth-child(3)),.dias[data-sel="3"] .dia:not(:nth-child(4)),.dias[data-sel="4"] .dia:not(:nth-child(5)){display:none}
}
@media (min-width:1101px){ .dtabs{display:none} }

.cl-dia{max-width:560px}
.cl-dia th,.cl-dia td{font-size:18px;padding:9px 8px}
.cl-dia thead th{font-size:12px}
.cl-dia tfoot th,.cl-dia tfoot td{font-size:18px}
.cl-ped{max-width:680px}.cl-ped td.ac,.cl-ped th:last-child{width:1%;white-space:nowrap;text-align:right}.cl-ped tr.cero td{color:var(--muted)}
.op-ped p.lp{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:0}.op-ped p.lp>span:first-child{min-width:0}.op-ped .btn{text-transform:none;flex:0 0 auto}
/* inicio */
.dash{display:flex;flex-direction:column;gap:16px}
/* Encabezado del inicio: el día de trabajo en grande y sus números. */
.dash-hero{display:grid;grid-template-columns:minmax(220px,1fr) 3fr;gap:18px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:20px 22px;position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.dh-sup{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.dash-hero h2{font-size:34px;line-height:1;margin:4px 0}
.dh-sub{font-size:15px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px 12px;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
.kpi:hover{background:rgba(255,255,255,.18)}
.kpi b{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;line-height:1.2;opacity:.9}
/* Avisos de lo que falta. */
.avisos{display:flex;flex-wrap:wrap;gap:8px}
.aviso{display:flex;gap:6px;align-items:center;padding:10px 14px;border:1px solid var(--warn);border-radius:999px;background:var(--warn-soft);color:var(--warn);font:500 15px var(--body);cursor:pointer;text-align:left}
.aviso strong{font-size:17px}
.todo-ok{color:var(--ok);font-weight:700;font-size:15px}
/* Tarjetas por sección. */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:stretch}
.tile{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;color:var(--ink);font:500 16px var(--body);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,40,55,.1)}
.t-cab{display:flex;align-items:center;gap:10px}
.t-cab .badge{margin-left:auto}
.t-ico{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:700 26px var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1}
.t-dia{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.t-nums{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;margin:12px 0 14px}
.t-nums strong{font:700 24px var(--display);text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
.t-nums strong.g{font-size:44px;line-height:1;color:var(--accent)}
.t-nums strong.g+span{font-size:18px;font-weight:700}
.t-vacio{margin:12px 0 14px;color:var(--muted)}
.t-sig{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--muted)}
.t-sig .t-dia{margin:0 0 2px}
.t-sig strong{color:var(--ink);font-weight:700}
.t-ir{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);opacity:0;transition:opacity .12s}
